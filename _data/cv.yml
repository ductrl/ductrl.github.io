    Publications:
      - title: Consumer-friendly EEG-based Emotion Recognition System: A Multi-scale Convolutional Neural Network Approach
        authors:
          - Tri Duc Ly
          - Gia H. Ngo
        publisher: 
        releaseDate: 2025-06-19
        url: https://doi.org/10.48550/arXiv.2506.16448
        summary: It concerned an interpretation of the Michelson–Morley experiment and the properties of light and time. Special relativity incorporates the principle that the speed of light is the same for all inertial observers regardless of the state of motion of the source.

      - title: Über einen die Erzeugung und Verwandlung des Lichtes betreffenden heuristischen Gesichtspunkt
        authors:
          - Albert Einstein
        publisher: Annalen der Physik
        releaseDate: 1905-03-18
        url: https://de.wikisource.org/wiki/Über_einen_die_Erzeugung_und_Verwandlung_des_Lichtes_betreffenden_heuristischen_Gesichtspunkt
        summary: This work explores the use of deep learning for recognizing human emotions from EEG brain signals. We designed a novel multi-scale convolutional neural network that learns patterns from different temporal resolutions and brain regions, achieving higher accuracy than existing state-of-the-art approaches. The results highlight the potential of EEG and machine learning for real-world affective computing applications.

      - title: Music therapy in Alzheimer’s disease: Considerations for implementation in Vietnam
        authors:
          - Tri Duc Ly
        publisher: Journal of Student Research
        releaseDate: 2024-08-15
        url: https://www.researchgate.net/publication/389019156_Music_Therapy_in_Alzheimer%27s_Disease_Considerations_for_Implementation_in_Vietnam
        summary: This review examines the potential of music therapy as a non-pharmacological intervention for individuals with Alzheimer's disease. By analyzing existing research, we identify factors influencing treatment effectiveness, summarize its benefits for cognitive and socio-emotional well-being, and discuss barriers to broader adoption in Vietnam. Our findings highlight the need for further research and greater integration of music therapy into dementia care practices.

